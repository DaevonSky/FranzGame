<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Fil Rouge</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>body{margin:0}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700;6..96,900&family=Public+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: eine Bühne in der Mitte, Fantasy-Nacht in Indigo mit Gold und arkanem Türkis; jeder Bildschirm ist eine Karte auf der Bühne. */
:root{
  --bg:#080d1c;--bg2:#101936;--panel:rgba(17,25,52,.86);--panel-2:rgba(32,45,90,.72);--line:#2c3c72;--line-2:#4659a8;
  --gold:#f2b441;--gold-2:#ffd98c;--gold-ink:#2a1c03;--arc:#86b6ff;--vio:#ff6b6b;--ember:#ff9f6e;
  --good:#5fd69a;--good-bg:rgba(95,214,154,.16);--bad:#ff6b7d;--bad-bg:rgba(255,107,125,.16);
  --fg:#eef1fb;--fg-2:#b6bfe0;--fg-3:#838db8;--paper:#f3ead7;--paper-ink:#2b2118;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;--body:"Public Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 520px at 80% -8%,rgba(70,100,210,.28),transparent 65%),radial-gradient(800px 600px at 6% 108%,rgba(229,72,77,.13),transparent 60%),linear-gradient(180deg,#0a1126,#060913)}
body::after{content:"";position:fixed;left:0;right:0;top:0;height:4px;z-index:60;background:linear-gradient(90deg,#2b59c3 0 33.3%,#f4f4f4 33.3% 66.6%,#e5484d 66.6%)}
#motes{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--arc);outline-offset:2px;border-radius:8px}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;min-height:100dvh;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;gap:18px;min-width:0}
.screen.fresh{animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.center{align-items:center;justify-content:center;text-align:center}
.logo{font-family:var(--display);font-weight:900;letter-spacing:.1em;font-size:clamp(36px,8.5vw,76px);line-height:1.02;color:var(--gold-2);text-shadow:0 0 28px rgba(242,180,65,.4),0 2px 0 #7a5a16;text-wrap:balance}
.sub{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;font-size:clamp(11px,2.4vw,14px);color:var(--arc);margin-top:10px}
.h2{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.4vw,28px);color:var(--gold-2);letter-spacing:.03em;text-wrap:balance}
.lbl{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3)}
.muted{color:var(--fg-2)}.sp{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;backdrop-filter:blur(6px);box-shadow:0 10px 40px rgba(0,0,0,.35);min-width:0}
.panel.pad-s{padding:14px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 20px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);font-family:var(--display);font-weight:700;letter-spacing:.05em;font-size:15px;color:var(--fg);transition:transform .15s,background .15s,border-color .15s}
.btn:hover{background:rgba(70,60,140,.55);border-color:var(--vio);transform:translateY(-1px)}
.btn.gold{background:linear-gradient(180deg,#f3d27e,#cf9f3d);border-color:#ffe9a8;color:var(--gold-ink);box-shadow:0 0 22px rgba(242,180,65,.3)}
.btn.gold:hover{background:linear-gradient(180deg,#ffe09a,#dba945)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.big{padding:15px 28px;font-size:17px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;color:var(--fg-2);font-size:19px}
.icon-btn:hover{background:var(--panel-2);color:var(--fg)}
input[type=text]{width:100%;background:rgba(8,7,20,.7);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;font-size:18px;min-width:0}
input[type=text]:focus{outline:2px solid var(--arc);outline-offset:0;border-color:transparent}
.codein{text-align:center;letter-spacing:.35em;text-transform:uppercase;font-family:var(--display);font-weight:700;font-size:20px;max-width:200px}
.av{width:var(--sz);height:var(--sz);border-radius:50%;display:inline-grid;place-items:center;flex:none;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 70%,white),var(--c));color:#0b0a18;border:2px solid rgba(255,255,255,.35)}
.av svg{width:58%;height:58%;stroke-width:2}
.sigs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sig{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border-radius:14px;border:1px solid transparent;width:84px;font-size:13px;color:var(--fg-2)}
.sig:hover{background:var(--panel-2)}
.sig.on{border-color:var(--gold);background:rgba(242,180,65,.1);color:var(--gold-2)}
.intro-card{width:min(440px,100%);display:flex;flex-direction:column;gap:18px;text-align:left}
.menu-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.hero{display:flex;gap:16px;align-items:center}
.hero .nm{font-family:var(--display);font-size:24px;font-weight:700;color:var(--gold-2);overflow-wrap:anywhere}
.xp{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--arc),var(--vio));border-radius:99px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;background:rgba(255,255,255,.08);color:var(--fg-2)}
.chip.ok{background:var(--good-bg);color:var(--good)}.chip.warn{background:rgba(242,144,95,.16);color:var(--ember)}
.opt-btns{display:grid;gap:12px}
.code-box{font-family:var(--display);font-weight:900;font-size:clamp(34px,8vw,56px);letter-spacing:.22em;color:var(--gold-2);text-shadow:0 0 20px rgba(242,180,65,.4);margin-right:-.22em}
.players{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04);min-width:0}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pl.me{border:1px solid var(--line-2)}
.pl .sc{font-family:var(--display);font-weight:700;color:var(--gold-2);font-variant-numeric:tabular-nums}
.pl.done .nm::after{content:" ✓";color:var(--good)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:6px;text-align:left}
.mode b{font-family:var(--display);font-size:16px;display:flex;gap:8px;align-items:center}
.mode span{font-size:14px;color:var(--fg-2)}
.mode.on{border-color:var(--gold);background:rgba(242,180,65,.1)}
.mode[disabled]{pointer-events:none}
.tps{display:flex;flex-wrap:wrap;gap:8px}
.tp{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--fg-3);display:inline-flex;gap:7px;align-items:center}
.tp i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tp.on{color:var(--fg);border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.tp[disabled]{pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{padding:7px 14px;font-weight:700;font-size:14px;color:var(--fg-2)}
.seg button.on{background:rgba(242,180,65,.18);color:var(--gold-2)}
.seg[disabled] button{pointer-events:none}
/* Ladebildschirm */
.ring{width:130px;height:130px;position:relative;margin:6px auto 0}
.ring i{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--gold);border-right-color:rgba(242,180,65,.3);animation:spin 2.4s linear infinite}
.ring i:nth-child(2){inset:14px;border-top-color:var(--arc);border-right-color:rgba(134,182,255,.3);animation-duration:1.7s;animation-direction:reverse}
.ring i:nth-child(3){inset:30px;border-top-color:var(--vio);border-right-color:rgba(255,107,107,.3);animation-duration:1.2s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:var(--gold-2);animation:pulse 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.55;transform:scale(.92)}}
.tipbox{max-width:560px;min-height:118px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center}
.tipbox p{font-size:20px;line-height:1.4;animation:rise .5s ease both}
.prog{width:min(420px,80vw);height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--arc));transition:width .4s linear}
/* Spiel */
.game{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.nodes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.node{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--fg-3)}
.node.now{border-color:var(--gold);color:var(--gold-2);box-shadow:0 0 12px rgba(242,180,65,.5)}
.node.past{background:rgba(134,182,255,.2);border-color:var(--arc);color:var(--arc)}
.node.boss{width:30px;height:30px;border-radius:9px;font-size:15px}
.timer{flex:1;min-width:120px;height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--arc),var(--gold));border-radius:99px}
.timer.low i{background:var(--bad)}
.tsec{font-family:var(--display);font-weight:700;font-size:18px;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.qcard{display:flex;flex-direction:column;gap:16px}
.qtag{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qtext{font-family:var(--display);font-weight:500;font-size:clamp(19px,3vw,25px);line-height:1.35;color:var(--fg);text-wrap:balance}
.story{font-style:italic;color:var(--arc);font-size:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.04);font-size:17px;min-width:0;overflow-wrap:anywhere;transition:border-color .15s,background .15s,transform .15s}
.opt:hover{border-color:var(--gold);background:rgba(242,180,65,.08);transform:translateY(-1px)}
.opt .k{font-family:var(--display);font-weight:700;color:var(--gold);width:22px;flex:none}
.opt.sel{border-color:var(--gold);background:rgba(242,180,65,.14)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.55}
.opt.lock{pointer-events:none}
.opt .dots{position:absolute;right:8px;top:-12px;display:flex}
.opt .dots .av{margin-left:-6px;border-color:var(--bg)}
.tag{margin-left:auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.me{background:rgba(242,180,65,.2);color:var(--gold-2)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 18px}
.pair .opt{align-items:center}
.pair .lt{font-family:var(--display);font-weight:900;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:inline-grid;place-items:center;font-size:13px;flex:none}
.slot{margin-left:auto;font-family:var(--display);font-weight:900;color:var(--gold-2)}
.expl{padding:14px 16px;border-radius:14px;background:rgba(134,182,255,.08);border:1px solid rgba(134,182,255,.3);color:var(--fg)}
.expl b{color:var(--arc);font-family:var(--display);letter-spacing:.06em}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;font-family:var(--display);font-weight:700}
.banner.good{background:var(--good-bg);color:var(--good);border:1px solid var(--good)}
.banner.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.banner.neutral{background:rgba(255,255,255,.06);color:var(--fg-2);border:1px solid var(--line)}
.flames{display:flex;gap:4px;font-size:22px;color:var(--ember)}
.flames .off{color:rgba(255,255,255,.18)}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
.boss-case{border:1px solid var(--gold);background:linear-gradient(180deg,rgba(242,180,65,.12),rgba(242,180,65,.03));border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.boss-case h3{font-family:var(--display);color:var(--gold-2);font-size:20px}
.lens{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.lens h4{margin:0;font-family:var(--display);font-size:15px;letter-spacing:.06em;color:var(--arc);display:flex;align-items:center;gap:8px}
.lens .opt{padding:10px 12px;font-size:16px}
.votes{display:flex;gap:10px;flex-wrap:wrap}
.votes .opt{flex:1 1 180px}
.vbar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}.vbar i{display:block;height:100%;background:var(--vio)}
.podium{display:flex;gap:14px;align-items:flex-end;justify-content:center;flex-wrap:wrap;margin:6px 0}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);min-width:120px;border:1px solid var(--line)}
.pod.first{border-color:var(--gold);background:rgba(242,180,65,.12);transform:translateY(-12px)}
.pod .rk{font-family:var(--display);font-weight:900;font-size:26px;color:var(--gold-2)}
.gain{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.badge{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.badge.off{opacity:.4;filter:grayscale(1)}
.badge .bi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(242,180,65,.16);color:var(--gold-2);font-size:21px;flex:none}
.badge small{display:block;color:var(--fg-2);font-size:14px;line-height:1.25}
/* Overlay & Buch */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,4,14,.78);display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));animation:fade .25s ease both}
@keyframes fade{from{opacity:0}}
.book{width:min(920px,100%);max-height:100%;display:grid;grid-template-columns:210px minmax(0,1fr);border-radius:16px;overflow:hidden;border:1px solid var(--gold);background:#16122f;box-shadow:0 0 60px rgba(242,180,65,.2)}
.toc{background:#0f0c24;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.toc button{padding:9px 10px;border-radius:9px;font-size:15px;color:var(--fg-2);line-height:1.25}
.toc button:hover{background:var(--panel-2)}.toc button.on{background:rgba(242,180,65,.16);color:var(--gold-2);font-weight:700}
.page{padding:22px 26px 26px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;max-height:min(80dvh,720px);animation:rise .35s ease both}
.page h2{font-family:var(--display);color:var(--gold-2);font-size:26px;line-height:1.15}
.page h3{font-family:var(--display);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--arc)}
.page ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.page .q{border-left:3px solid var(--gold);padding:6px 14px;font-style:italic;color:var(--gold-2);background:rgba(242,180,65,.07);border-radius:0 10px 10px 0}
.page table{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
.page th,.page td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.page th{background:rgba(255,255,255,.06);font-family:var(--display);font-size:13px;color:var(--gold-2)}
.scrollx{overflow-x:auto;max-width:100%}
.bhead{display:flex;align-items:center;gap:10px;grid-column:1/-1;padding:10px 14px;background:#0b091d;border-bottom:1px solid var(--line)}
.dlg{width:min(560px,100%);display:flex;flex-direction:column;gap:14px;max-height:100%;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:#241d52;border:1px solid var(--gold);color:var(--fg);padding:10px 18px;border-radius:12px;max-width:min(520px,calc(100vw - 32px));box-shadow:0 8px 30px rgba(0,0,0,.5);animation:rise .3s ease both}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@media (max-width:900px){.game{grid-template-columns:minmax(0,1fr)}.side{position:static}.menu-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){
  body{font-size:16px}
  .opts{grid-template-columns:1fr}.pair{gap:8px}.modes{grid-template-columns:1fr}
  .book{grid-template-columns:minmax(0,1fr);max-height:100%;overflow-y:auto}
  .toc{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.toc button{white-space:nowrap}
  .page{max-height:none;padding:18px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

/* Eingabe, Szene, Bewertung */
.blank{display:inline-block;width:auto;min-width:120px;max-width:100%;padding:5px 10px;margin:0 4px;border-radius:9px;font-size:17px;background:rgba(5,8,20,.75);border:1.5px solid var(--line-2);border-bottom:3px solid var(--gold)}
.blank.ok{border-color:var(--good);background:var(--good-bg)}.blank.half{border-color:var(--ember)}.blank.bad{border-color:var(--bad);background:var(--bad-bg)}
.gaptext{font-size:clamp(18px,2.6vw,22px);line-height:2.3;overflow-wrap:anywhere}
textarea.free,input.blank{font-family:inherit}
textarea.free{width:100%;min-height:92px;resize:vertical;background:rgba(5,8,20,.75);border:1.5px solid var(--line-2);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.5}
textarea.free:focus,input.blank:focus{outline:2px solid var(--arc);outline-offset:0}
.de{font-family:var(--display);font-size:clamp(19px,3vw,24px);color:var(--fg)}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{padding:8px 14px;border-radius:10px;border:1.5px solid var(--line-2);background:rgba(255,255,255,.05);font-size:17px}
.word:hover{border-color:var(--gold)}.word.used{opacity:.3;pointer-events:none}
.built{min-height:52px;padding:10px 14px;border-radius:12px;border:1.5px dashed var(--line-2);font-size:19px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.built .word{background:rgba(242,180,65,.15);border-color:var(--gold)}
.scene{border-radius:14px;overflow:hidden;border:1px solid var(--gold);background:#000}
.scene svg{display:block;width:100%;height:auto}
.cityline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--fg-2)}
.cityline b{font-family:var(--display);color:var(--gold-2);font-size:18px}
.clue{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:rgba(242,180,65,.1);border:1px solid var(--gold);color:var(--gold-2)}
.rulecard{padding:12px 14px;border-radius:12px;background:var(--paper);color:var(--paper-ink);font-size:15.5px}
.rulecard b{font-family:var(--display)}
.rubric{display:flex;flex-direction:column;gap:6px;font-size:15px}
.rub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.04)}
.rub.on{background:var(--good-bg)}.rub.off{background:var(--bad-bg)}
.ptxt{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.05);font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.model{padding:12px 14px;border-radius:12px;background:var(--paper);color:var(--paper-ink);font-size:15.5px;line-height:1.55}
.sol{color:var(--good);font-weight:700}.mis{color:var(--bad)}
.hintbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt.hid{visibility:hidden}
.page .rule{background:var(--paper);color:var(--paper-ink);padding:10px 14px;border-radius:10px}
.page .ex{color:var(--fg-2);font-size:15px}
.page td b,.page li b{color:var(--gold-2)}
.vocgrid{columns:2 240px;column-gap:24px}.vocgrid div{break-inside:avoid;padding:3px 0;border-bottom:1px solid var(--line);font-size:15px}
@media (max-width:700px){.blank{min-width:90px}.gaptext{line-height:2.4}}

/* ---------- Bewertung freier Texte ---------- */
function norm(s){return String(s==null?'':s).toLowerCase().replace(/[’‘`´]/g,'\'').replace(/œ/g,'oe').replace(/[.,!?;:«»"“”()]/g,' ').replace(/\s+/g,' ').trim()}
function noacc(s){return norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function noart(s){return s.replace(/^(le|la|les|l'|un|une|des|du) ?/,'')}
function typedFr(u,vars){var a=norm(u),b=noacc(u),best=0;if(!a)return 0;
  vars.forEach(function(v){var n=norm(v),m=noacc(v),f=0;
    if(a===n)f=1;else if(b===m)f=.5;else if(noart(b)===noart(m))f=.5;
    else{var x=b.split(' '),y=m.split(' '),c=0;x.forEach(function(w){if(y.indexOf(w)>=0)c++});var d=2*c/(x.length+y.length);if(d>=.7)f=.4*d}
    if(f>best)best=f});return best}
function gradeBoss(si,tx){var sc=SCENES[si],A=noacc(tx[0]||''),B=noacc(tx[1]||''),C=noacc(tx[2]||''),all=A+' '+B+' '+C,items=[],tot=0;
  var per=sc.ps.map(function(p,k){var c=0,m=[];[['h',p.h],['t',p.t],['a',p.a],['ac',p.ac],['w',p.w]].forEach(function(r){if(r[1].test(A)){c++;m.push(r[0])}});return {k:k,c:c,m:m}});
  per.sort(function(a,b){return b.c-a.c});var pp=per[0].c+per[1].c;
  items.push(['Zwei Personen genau beschrieben (Haare, Kleidung, Zubehör, Tätigkeit, Person)',pp,10]);tot+=pp;
  var loc=(A.match(/\b(a gauche|a droite|au milieu|au centre|au premier plan|a l'arriere-plan|au fond|devant|derriere|a cote de|pres de|au second plan)\b/g)||[]).length,lp=Math.min(2,loc);items.push(['Ortsangaben (à gauche, au premier plan …)',lp,2]);tot+=lp;
  var ip=/\b(sur (l'|la |cette )?(image|photo|dessin|scene|illustration)|on voit|je vois|l'image montre|la photo montre|cette image)\b/.test(A)?1:0;items.push(['Einleitung (Sur l’image, on voit …)',ip,1]);tot+=ip;
  var sp=/\b(peut-etre|probablement|sans doute|il semble|elle semble|ils semblent|on dirait|j'imagine|je pense|je suppose|doit etre|doivent etre|a l'air|ont l'air|surement)\b/.test(A)?1:0;items.push(['Vermutung (Il semble, elle a l’air …)',sp,1]);tot+=sp;
  var bs=String(tx[1]||'').split(/[.!?\n]+/).map(noacc),bc=0;bs.forEach(function(s){if(/\b(avait|avaient|etait|etaient|avais|avions|avaient|s'etait|s'etaient)\s+(\w+\s+)?(\w+(e|i|u|is|it|ert|te|ts|ris|rt))\b/.test(s)&&s.trim().split(' ').length>=3)bc++});bc=Math.min(2,bc);items.push(['Zwei Sätze im plus-que-parfait (Teil B)',bc,2]);tot+=bc;
  var cp=/\b(pour|sans|avant de|avant d')\s*\w+(er|ir|re|oir)\b|\bapres (avoir|etre|s'etre)\s+\w+/.test(C)?1:0;items.push(['Infinitivsatz (Teil C)',cp,1]);tot+=cp;
  var wc=(tx[0]||'').trim().split(/\s+/).filter(Boolean).length;
  return {pts:tot,max:17,fr:Math.min(1,tot/17/0.8),items:items,wc:wc,ok:tot/17>=0.7,found:per}}

var BOOK=[
{t:'Willkommen',h:'<h3>Le Fil Rouge – dein Fall</h3><p>Ein berühmtes Gemälde ist aus dem Louvre verschwunden. Der rote Faden führt durch acht Städte: Paris, Lyon, Marseille, Bordeaux, Strasbourg, Nice, Lille und Toulouse. Jede richtige Antwort bringt einen <b>Indice</b> (Hinweis). Fünf Hinweise entlarven den Dieb.</p><p>Am Ende wartet der <b>Boss</b>: Du beschreibst ein Bild („Bildbeschreibung“) und schreibst dazu Sätze im plus-que-parfait und mit Infinitivkonstruktion.</p><div class="rule"><b>Fragetypen:</b> Auswahl, Vrai/Faux, Lückentext zum Tippen, Übersetzen (Deutsch → Französisch), Zuordnen, Satzbau und der Boss mit freiem Text.</div><p class="ex">Tipp: Tippe möglichst mit Akzenten (é, è, à, ç …). Fehlende Akzente zählen nur als „fast richtig“.</p>'},
{t:'Les temps du passé',h:'<h3>Die drei Vergangenheiten im Überblick</h3><table><tr><th>Zeit</th><th>Bildung</th><th>Funktion</th></tr><tr><td><b>passé composé</b></td><td>avoir/être (Präsens) + participe passé</td><td>einzelne, abgeschlossene Handlung („Vordergrund“)</td></tr><tr><td><b>imparfait</b></td><td>nous-Stamm + -ais, -ais, -ait, -ions, -iez, -aient</td><td>Beschreibung, Gewohnheit, Dauer („Hintergrund“)</td></tr><tr><td><b>plus-que-parfait</b></td><td>imparfait von avoir/être + participe passé</td><td>Vorzeitigkeit: was schon vorher geschehen war</td></tr></table><div class="rule">Hier, il <b>pleuvait</b> (Hintergrund) quand je <b>suis sorti</b> (Ereignis). Je ne savais pas qu’il <b>avait plu</b> toute la nuit (Vorzeitigkeit).</div>'},
{t:'Passé composé',h:'<h3>Le passé composé</h3><p><b>Mit avoir</b> (die meisten Verben): j’ai mangé, tu as fini, nous avons pris. Das Partizip bleibt gleich – außer bei einem <b>vorangestellten direkten Objekt</b>: Les photos que j’ai <b>prises</b>.</p><p><b>Mit être:</b> aller, venir, arriver, partir, entrer, sortir, rentrer, rester, monter, descendre, tomber, naître, mourir, devenir, revenir, retourner, passer (par …) und <b>alle reflexiven Verben</b>. Das Partizip passt sich dem Subjekt an: Elle est allée. Ils se sont levés.</p><h3>Wichtige unregelmäßige Partizipien</h3><ul><li>avoir → <b>eu</b> · être → <b>été</b> · faire → <b>fait</b> · prendre → <b>pris</b></li><li>voir → <b>vu</b> · pouvoir → <b>pu</b> · vouloir → <b>voulu</b> · devoir → <b>dû</b></li><li>mettre → <b>mis</b> · dire → <b>dit</b> · écrire → <b>écrit</b> · lire → <b>lu</b></li><li>ouvrir → <b>ouvert</b> · offrir → <b>offert</b> · boire → <b>bu</b> · naître → <b>né</b> · mourir → <b>mort</b></li></ul><div class="rule">Verneinung: Je <b>n’</b>ai <b>pas</b> mangé. Reflexiv: Elle ne s’est pas levée.</div>'},
{t:'Imparfait',h:'<h3>L’imparfait</h3><p>Nimm die <b>nous-Form</b> des Präsens, streiche -ons und hänge die Endungen an: nous parl<i>ons</i> → je parl<b>ais</b>, tu parl<b>ais</b>, il parl<b>ait</b>, nous parl<b>ions</b>, vous parl<b>iez</b>, ils parl<b>aient</b>.</p><ul><li><b>être</b> ist die einzige Ausnahme: j’étais, tu étais, il était, nous étions, vous étiez, ils étaient.</li><li>-cer: nous commen<b>ç</b>ons → je commen<b>ç</b>ais, aber nous commencions.</li><li>-ger: nous mangeons → je mang<b>e</b>ais, aber nous mangions.</li><li>faire → faisais · avoir → avais · finir → finissais · aller → allais · voir → voyais</li></ul><h3>Wann imparfait?</h3><ul><li>Beschreibung von Personen, Orten, Wetter: Il faisait beau.</li><li>Gewohnheiten: Chaque été, nous allions à la mer.</li><li>gleichzeitig laufende Handlungen und Zustände: Elle lisait pendant que je cuisinais.</li><li>Handlung im Verlauf, die unterbrochen wird: Je dormais quand il a téléphoné.</li></ul>'},
{t:'Plus-que-parfait',h:'<h3>Le plus-que-parfait</h3><p><b>Bildung:</b> imparfait von avoir oder être + participe passé. Dasselbe Hilfsverb wie im passé composé.</p><ul><li>Il <b>avait</b> mangé. Nous <b>avions</b> fini.</li><li>Elle <b>était</b> partie. Ils <b>étaient</b> arrivés.</li><li>Elle <b>s’était</b> levée. (reflexiv: immer être)</li></ul><p><b>Funktion:</b> Die Handlung geschah <b>vor</b> einer anderen Handlung in der Vergangenheit.</p><div class="rule">Quand je suis arrivé, le film <b>avait</b> déjà <b>commencé</b>. – Il m’a dit qu’il <b>avait perdu</b> ses clés.</div><p>Signalwörter: <b>déjà, la veille, auparavant, avant, jamais (zuvor)</b>.</p>'},
{t:'pc oder imparfait ?',h:'<h3>Passé composé oder imparfait?</h3><table><tr><th>passé composé</th><th>imparfait</th></tr><tr><td>soudain, tout à coup, un jour, hier, à ce moment-là</td><td>souvent, toujours, d’habitude, chaque jour, pendant que</td></tr><tr><td>Handlungsfolge: d’abord … puis … ensuite</td><td>Beschreibung, Hintergrund, Gefühle, Wetter</td></tr><tr><td>abgeschlossen, Ergebnis</td><td>Dauer, Wiederholung, Zustand</td></tr></table><div class="rule"><b>Fragetest:</b> „Was geschah dann?“ → passé composé. „Wie war die Situation?“ → imparfait. „Was war schon vorher?“ → plus-que-parfait.</div><p class="ex">Beispiel: Il <b>faisait</b> nuit. Soudain, un bruit <b>a retenti</b>. Marc <b>avait</b> déjà <b>fermé</b> la porte, mais il <b>a ouvert</b> la fenêtre.</p>'},
{t:'Phrases à l’infinitif',h:'<h3>Elegant formulieren mit dem Infinitiv</h3><table><tr><th>Baustein</th><th>Bedeutung</th><th>Beispiel</th></tr><tr><td><b>pour + Inf.</b></td><td>um … zu</td><td>Il travaille pour réussir.</td></tr><tr><td><b>sans + Inf.</b></td><td>ohne … zu</td><td>Elle part sans dire un mot.</td></tr><tr><td><b>avant de + Inf.</b></td><td>bevor man …</td><td>Je lis avant de dormir.</td></tr><tr><td><b>après avoir / être + part. passé</b></td><td>nachdem man … hat</td><td>Après avoir mangé, il est sorti.</td></tr></table><div class="rule"><b>Regeln:</b> 1) Beide Satzteile haben dasselbe Subjekt. 2) Nach après: avoir oder être + Partizip, wie im passé composé; bei être passt sich das Partizip an (Après être arrivée, elle …). 3) Reflexiv: Après s’être levé(e) … 4) Verneinung: beide Teile vor dem Infinitiv: pour <b>ne pas</b> rater, sans <b>jamais</b> dire.</div>'},
{t:'Portrait d’une personne',h:'<h3>Faire le portrait d’une personne</h3><p><b>Aussehen:</b> grand(e), petit(e), mince, fort(e), jeune, âgé(e) · les cheveux longs/courts/frisés/raides, blonds, bruns, noirs, roux, gris · les yeux bleus, verts, marron · la barbe, la moustache · les lunettes (f. pl.), les taches de rousseur, les rides.</p><p><b>Kleidung:</b> porter une veste, un pull, un manteau, un t-shirt, une robe, une jupe, un pantalon, une casquette, un bonnet, un chapeau, un béret, une écharpe.</p><p><b>Charakter:</b> sympathique, timide, généreux/généreuse, têtu(e), drôle, calme, nerveux/nerveuse, ouvert(e), travailleur/travailleuse.</p><p><b>Wirkung:</b> Il a l’air fatigué. Elle semble contente. Elle a l’air de s’ennuyer.</p><div class="rule">Farben: Adjektive wie <i>marron, orange</i> bleiben unverändert. Les yeux <b>bleus</b> (Plural), une veste <b>bleue</b> (feminin).</div><p class="ex">Beispiel: Léa est grande et mince. Elle a les cheveux longs et roux et elle porte souvent des lunettes rondes. Elle est drôle et très généreuse.</p>'},
{t:'Décrire une image',h:'<h3>Bildbeschreibung in 4 Schritten</h3><ol><li><b>Einleitung:</b> Sur l’image/la photo, on voit … Il s’agit d’une scène à …</li><li><b>Ort und Aufbau:</b> au premier plan, à l’arrière-plan, au fond, à gauche, à droite, au milieu, devant, derrière, à côté de.</li><li><b>Personen:</b> Aussehen, Kleidung, Tätigkeit (Präsens!): Elle porte …, il lit …, ils discutent …</li><li><b>Deutung:</b> Il semble que … / Elle a l’air … / Ils doivent être … / Peut-être … / Je pense que …</li></ol><div class="rule"><b>Im Boss benötigst du:</b> Teil A (ca. 40–60 Wörter): Einleitung, Ort, zwei Personen genau, eine Vermutung. Teil B: zwei Sätze im plus-que-parfait über das, was vorher passiert war. Teil C: ein Satz mit pour / sans / avant de / après avoir|être + Infinitiv.</div><p class="ex">Beispiel: Sur l’image, on voit une place à Lyon. À gauche, un jeune homme à la barbe joue de la guitare. Il porte une veste grise. Au milieu, une femme blonde tient un parapluie. Elle semble attendre quelqu’un. – Avant de venir, le jeune homme avait emporté sa guitare. – La femme regarde le ciel pour savoir s’il va pleuvoir.</p>'},
{t:'Connecteurs',h:'<h3>Redemittel für Texte</h3><ul><li><b>Reihenfolge:</b> d’abord, puis, ensuite, après, enfin, finalement, plus tard</li><li><b>Zeit:</b> soudain, tout à coup, pendant que, quand, lorsque, à ce moment-là, la veille, le lendemain</li><li><b>Grund/Folge:</b> parce que, car, comme, donc, alors, c’est pourquoi</li><li><b>Gegensatz:</b> mais, pourtant, cependant, par contre, malgré</li><li><b>Meinung:</b> à mon avis, je pense que, il me semble que, selon moi</li></ul><div class="rule">„denn“ = <b>car</b> (nie am Satzanfang) · „weil“ = <b>parce que</b> · „gleichzeitig“ = <b>en même temps</b>.</div>'},
{t:'Banlieue-Wortschatz',h:'<h3>Vokabeln aus deinen Karten</h3><p class="ex">Deine Anki-Datei enthielt nur die deutsche Seite. Die französischen Entsprechungen wurden ergänzt – bitte mit deinem Schulbuch abgleichen.</p><div class="vocgrid" id="vocg"></div>'},
{t:'Fehlerfallen',h:'<h3>Typische Fehler</h3><ul><li><b>Falsches Hilfsverb:</b> ✗ J’ai allé → ✓ Je suis allé(e).</li><li><b>Keine Angleichung bei être:</b> ✗ Elle est parti → ✓ Elle est partie.</li><li><b>Reflexiv mit avoir:</b> ✗ Elle a levée → ✓ Elle s’est levée.</li><li><b>imparfait statt passé composé</b> für Einzelereignisse: ✗ Soudain, il entendait un bruit → ✓ Soudain, il a entendu un bruit.</li><li><b>Plusquamperfekt vergessen:</b> ✗ Quand je suis arrivé, il est parti → ✓ … il était déjà parti.</li><li><b>Infinitiv:</b> ✗ sans disant → ✓ sans dire. ✗ après arriver → ✓ après être arrivé(e).</li><li><b>Adjektiv:</b> ✗ les cheveux long → ✓ les cheveux longs.</li><li><b>Brille:</b> ✗ une lunette → ✓ des lunettes.</li></ul>'}];
var TIPS=['Le saviez-vous ? Die Baguette gehört seit 2022 zum immateriellen Kulturerbe der UNESCO.','Merke: Bei „aller“, „venir“, „partir“ & Co. nimmst du être. Das Partizip richtet sich nach dem Subjekt.','Le saviez-vous ? Der Eiffelturm wurde für die Weltausstellung 1889 gebaut und sollte nur 20 Jahre stehen bleiben.','Merke: Soudain = passé composé. D’habitude = imparfait. Auparavant = plus-que-parfait.','Eselsbrücke: Nach „sans“ und „avant de“ steht der Infinitiv – ganz ohne Hilfsverb.','Le saviez-vous ? In Marseille isst man gern Bouillabaisse, einen Fischeintopf mit Safran.','Merke: „Après“ braucht immer avoir/être + Partizip: Après avoir mangé, … Après être sortie, …','Le saviez-vous ? Das Straßburger Münster war jahrhundertelang das höchste Gebäude der Welt.','Beim Beschreiben: Zuerst Ort, dann Personen, am Ende eine Vermutung (il semble que …).','Merke: les yeux bleus, les cheveux longs: Adjektive nach „les“ stehen im Plural.','Le saviez-vous ? Die Promenade des Anglais in Nice ist knapp 7 km lang.','Tipp: Tippe Akzente mit. Ohne Akzent gibt es nur halbe Punkte.','Le saviez-vous ? Toulouse heißt „la ville rose“ – wegen der rosa Backsteine.','Merke: Reflexive Verben bilden das passé composé immer mit être.'];

function rankOf(xp){var i=0;RANKS.forEach(function(r,k){if(xp>=r[0])i=k});var nx=RANKS[i+1];return {name:RANKS[i][1],pct:nx?Math.round((xp-RANKS[i][0])/(nx[0]-RANKS[i][0])*100):100,next:nx?nx[0]:null}}

function toast(m,ms){var t=$('#toast');t.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toastT);toastT=setTimeout(function(){t.innerHTML=''},ms||3200)}
/* ---------- Räume ---------- */
function LocalRoom(){var me={peer:'local',isMe:true,sameTab:true,kind:'viewer',guest:false,by:null,presence:{},updatedAt:Date.now()},hs={},ph=[];
 return {emit:function(t,d){setTimeout(function(){(hs[t]||[]).slice().forEach(function(h){h({topic:t,data:d,peer:'local',isMe:true,sameTab:true,kind:'viewer',guest:false,by:null})})},0);return Promise.resolve()},
 on:function(t,h){(hs[t]=hs[t]||[]).push(h);return function(){hs[t]=(hs[t]||[]).filter(function(x){return x!==h})}},
 presence:function(p){var np=Object.assign({},me.presence);for(var k in p){if(p[k]===null)delete np[k];else np[k]=p[k]}me=Object.assign({},me,{presence:np,updatedAt:Date.now()});ph.slice().forEach(function(h){h({peers:[me],joined:[],left:[],updated:[me]})});return Promise.resolve()},
 peers:function(){return [me]},onPeers:function(h){ph.push(h);setTimeout(function(){h({peers:[me],joined:[me],left:[],updated:[]})},0);return function(){ph=ph.filter(function(x){return x!==h})}},
 connected:function(){return true},onConnection:function(h){setTimeout(function(){h(true)},0);return function(){}},leave:function(){return Promise.resolve()}}}
function pres(p){if(G.room){try{G.room.presence(p).catch(function(){})}catch(e){}}}
function plist(){return G.room?G.room.peers().filter(function(p){return p.kind!=='agent'&&p.presence&&p.presence.name}):[]}
function hostPeer(){var a=plist(),best=null;a.forEach(function(p){var t=+p.presence.t||0;if(!best||t<best.t||(t===best.t&&p.peer<best.p.peer))best={t:t,p:p}});return best&&best.p}
function iAmHost(){var h=hostPeer();return !!(h&&h.sameTab)}
function players(){return plist().filter(function(p){return !p.presence.sp})}
async function joinRoom(code,solo){
  var room=null;
  if(!solo&&base){try{room=await base.join('fil-'+code.toLowerCase())}catch(e){room=null;toast('Die Lobby konnte nicht geöffnet werden. Du spielst solo.',5000)}}
  else if(!solo){toast('Mehrspieler ist hier nicht verfügbar. Du spielst solo.',5000)}
  if(!room){room=LocalRoom();solo=true;code='SOLO'}
  teardown();resetMy();
  G.room=room;G.code=code;G.solo=solo;G.S=null;G.maxRev=0;G.run=null;G.spec=false;G.dead=false;G.conn=true;G.joinedAt=Date.now();G.gain=null;
  var onErr=function(){G.dead=true;toast('Die Verbindung zur Lobby wurde beendet.',5000);render()};
  G.unsub=[room.on('state',onStateMsg,onErr),room.onPeers(onPeers,onErr),room.onConnection(function(c){G.conn=c;schedRender()},onErr)];
  pres({name:P.name,av:P.av,role:P.role,t:Date.now(),sc:0,st:0,q:-1});
  if(P.roles.indexOf(P.role)<0){P.roles.push(P.role);if(P.roles.length>=3)giveBadge('curieux');saveP()}
  G.tk=setInterval(tick,400);G.hb=setInterval(heartbeat,4000);
  go('lobby');
}
function giveBadge(id){if(!P.badges[id]){P.badges[id]=1;saveP();return true}return false}
function teardown(){clearInterval(G.tk);clearInterval(G.hb);(G.unsub||[]).forEach(function(u){try{u()}catch(e){}});G.unsub=[];if(G.room){try{G.room.leave()}catch(e){}}G.room=null}
function leaveRoom(){teardown();G.S=null;G.run=null;G.spec=false;go('menu')}
/* ---------- Zustand senden und empfangen ---------- */
function emitErr(e){if(e&&e.code==='not_permitted')toast('Dir fehlen die Rechte zum Mitspielen. Die Seite muss dir als Mitwirkender (Contributor) freigegeben sein.',7000)}
function hostEmit(patch){if(!G.room)return;var s=Object.assign({},G.S||{ph:'lobby',mode:'vs',tp:ALLTP.slice(),n:7,i:0,fl:3,lt:0},patch);s.rev=G.maxRev+1;try{G.room.emit('state',s).catch(emitErr)}catch(e){}}
function heartbeat(){if(G.room&&G.S&&iAmHost()){try{G.room.emit('state',Object.assign({},G.S,{left:Math.max(0,(G.dl-Date.now())/1000)})).catch(function(){})}catch(e){}}}
function cleanState(s){
  if(!s||typeof s!=='object')return null;if(['lobby','load','q','rv','end'].indexOf(s.ph)<0)return null;
  var c=function(v,a,b,d){v=+v;if(isNaN(v))v=d;return Math.max(a,Math.min(b,v))};
  var o={ph:s.ph,rev:c(s.rev,0,1e9,0),mode:s.mode==='coop'?'coop':'vs',n:c(s.n,1,12,7),i:c(s.i,0,20,0),left:c(s.left,0,400,0),fl:c(s.fl,0,9,3),lt:c(s.lt,0,30,0),good:s.good?1:0,win:s.win?1:0,seed:c(s.seed,0,2e9,0),boss:c(s.boss,0,SCENES.length-1,0)};
  o.tp=(Array.isArray(s.tp)?s.tp:[]).filter(function(t){return TOP[t]}).slice(0,8);if(!o.tp.length)o.tp=ALLTP.slice();
  o.ids=(Array.isArray(s.ids)?s.ids:[]).filter(function(id){return typeof id==='string'&&BYID[id]}).slice(0,12);
  if(o.ph!=='lobby'&&o.ids.length)o.n=o.ids.length;
  return o}
function onStateMsg(m){var s=cleanState(m&&m.data);if(s)applyState(s)}
function applyState(s){
  if(G.S&&s.rev<=G.S.rev)return;
  var prev=G.S;G.S=s;G.maxRev=s.rev;G.dl=Date.now()+s.left*1000;
  var changed=!prev||prev.ph!==s.ph||prev.i!==s.i;
  if(!prev&&s.ph!=='lobby'){G.spec=true;pres({sp:1})}
  if(s.ph==='lobby'){G.spec=false;resetMy();G.run=null;pres({sp:null,sc:0,st:0,q:-1,d:null,a:null,ok:null,fr:null,pts:0,pk:null})}
  if(s.ph==='load'&&(prev&&prev.ph==='lobby'||!G.run)){if(!G.spec)resetMy();pres({sc:0,st:0,q:-1,d:null,a:null,ok:null,fr:null,pts:0,pk:null});G.tip=Math.floor(Math.random()*TIPS.length)}
  if(s.ids.length&&(!G.run||G.run.seed!==s.seed))buildRun(s);
  if(s.ph==='q'&&changed){var v=curView();G.cur=newCur(v);G.answered=false;G.qStart=Date.now();pres({pk:null})}
  if(s.ph==='end')awardEnd();
  render(changed)}
function onPeers(ch){if(ch.joined.some(function(p){return !p.isMe})&&G.S&&iAmHost())heartbeat();schedRender()}
/* ---------- Fragen und Wertung ---------- */
function viewOf(q,seed){
  var r=rng(hash(seed+':'+q.id)),b={id:q.id,tp:q.tp,ty:q.ty,tx:q.q,ex:q.ex};
  if(q.ty==='mc'){var o=shuffle([q.c].concat(q.w),r);b.opts=o;b.cor=o.indexOf(q.c);b.dur=25}
  else if(q.ty==='tf'){b.opts=['Vrai','Faux'];b.cor=q.a?0:1;b.dur=18}
  else if(q.ty==='gp'){b.parts=q.t.split('{}');b.ans=q.a;b.dur=Math.min(80,28+22*q.a.length)}
  else if(q.ty==='tr'){b.vars=q.a;b.dur=60}
  else if(q.ty==='ma'){var R=shuffle(q.p.map(function(x){return x[1]}),r);b.L=q.p.map(function(x){return x[0]});b.R=R;b.map=q.p.map(function(x){return R.indexOf(x[1])});b.dur=50}
  else{var ix=shuffle(q.items.map(function(_,i){return i}),r);b.items=ix.map(function(i){return q.items[i]});b.sorted=q.items;b.alts=q.alts||[];b.dur=60}
  return b}
function bossView(si){return {id:'boss',tp:'bs',ty:'bs',si:si,dur:240}}
function buildRun(s){G.run={seed:s.seed,qs:s.ids.map(function(id){return viewOf(BYID[id],s.seed)}),boss:bossView(s.boss)}}
function curView(){var S=G.S;if(!S||!G.run)return null;return S.i<G.run.qs.length?G.run.qs[S.i]:G.run.boss}
function newCur(v){if(!v)return {};if(v.ty==='ma'){var m=[];v.L.forEach(function(){m.push(-1)});return {map:m,al:-1}}if(v.ty==='or')return {seq:[]};
  if(v.ty==='gp'){return {tx:v.ans.map(function(){return ''})}}if(v.ty==='tr')return {tx:['']};if(v.ty==='bs')return {tx:['','','']};return {pk:-1,hid:[]}}
function cityOf(i){var S=G.S;return CITIES[(i+S.seed)%CITIES.length]}
function thief(){return THIEVES[G.S.seed%THIEVES.length]}
function isTyped(v){return v.ty==='gp'||v.ty==='tr'||v.ty==='bs'}
function grade(v,a){var c=0;
  if(v.ty==='mc'||v.ty==='tf'){var ok=a===v.cor;return {ok:ok,fr:ok?1:0}}
  if(v.ty==='ma'){v.map.forEach(function(m,i){if(a&&a[i]===m)c++});return {ok:c===v.map.length,fr:c/v.map.length}}
  if(v.ty==='or'){var w=(a||[]).map(function(d){return v.items[d]||''}),j=norm(w.join(' ')),goods=[v.sorted].concat(v.alts).map(function(x){return norm(x.join(' '))});
    if(goods.indexOf(j)>=0)return {ok:true,fr:1};w.forEach(function(x,k){if(norm(x)===norm(v.sorted[k]||''))c++});return {ok:false,fr:c/v.sorted.length*.5}}
  if(v.ty==='gp'){var t=0;v.ans.forEach(function(vs,i){t+=typedFr((a&&a[i])||'',vs)});var f=t/v.ans.length;return {ok:f>=.999,fr:f}}
  if(v.ty==='tr'){var f2=typedFr(typeof a==='string'?a:'',v.vars);return {ok:f2>=.999,fr:f2}}
  var g=gradeBoss(v.si,(a&&a.t)||[]);return {ok:g.ok,fr:g.fr,bw:g.wc}}
function submit(ans){
  var S=G.S;if(!S||S.ph!=='q'||G.spec||G.answered)return;var v=curView();if(!v)return;
  var left=(G.dl-Date.now())/1000,g=grade(v,ans),pts,m=G.my,role=myRole().id;
  if(v.ty==='bs')pts=Math.round(g.fr*600);
  else{pts=Math.round(100*g.fr);if(g.ok){var sp=Math.round(100*Math.max(0,Math.min(1,left/v.dur))),stb=Math.min(m.st,5)*20;if(role==='jou')sp*=2;if(role==='car')stb*=2;pts+=sp+stb;if(role==='lin'&&isTyped(v))pts+=20}}
  if(G.cur.hp)pts=Math.max(0,pts-25);
  G.answered=true;G.myA[S.i]={a:ans,ok:g.ok,fr:g.fr,pts:pts};m.sc+=pts;
  if(v.ty==='bs'){m.bossOk=g.ok;m.bossFr=g.fr;m.wc=g.bw||0}
  else{var t=m.tpc[v.tp]||[0,0];t[1]++;if(g.ok)t[0]++;m.tpc[v.tp]=t;if(isTyped(v)){m.ty++;if(g.ok)m.tyOk++}}
  if(g.ok){m.st++;if(v.ty!=='bs')m.okc++}else if(role==='gar'&&!m.gd){m.gd=true}else m.st=0;m.best=Math.max(m.best,m.st);
  var pa=ans;if(v.ty==='bs')pa={t:(ans.t||[]).map(function(x){return String(x).slice(0,380)})};else if(v.ty==='gp')pa=(ans||[]).map(function(x){return String(x).slice(0,60)});else if(v.ty==='tr')pa=String(ans||'').slice(0,200);
  pres({q:S.i,d:1,a:pa,ok:g.ok?1:0,fr:g.fr,pts:pts,sc:m.sc,st:m.st,pk:null});render()}
function autoSubmit(){var v=curView();if(!v)return;var c=G.cur,a;
  if(v.ty==='mc'||v.ty==='tf')a=c.pk!=null?c.pk:-1;else if(v.ty==='ma')a=c.map;else if(v.ty==='or')a=c.seq;else if(v.ty==='gp')a=c.tx;else if(v.ty==='tr')a=c.tx[0];else a={t:c.tx};submit(a)}
function canConfirm(v){var c=G.cur;if(v.ty==='mc'||v.ty==='tf')return c.pk>=0;if(v.ty==='ma')return c.map.every(function(x){return x>=0});if(v.ty==='or')return c.seq.length===v.items.length;
  if(v.ty==='gp')return c.tx.some(function(x){return x.trim()});if(v.ty==='tr')return !!c.tx[0].trim();return !!c.tx[0].trim()}
/* ---------- Host-Ablauf ---------- */
function allAnswered(){var ps=players();return ps.length>0&&ps.every(function(p){return p.presence.q===G.S.i&&p.presence.d===1})}
function hostReveal(){var S=G.S,ps=players(),sum=0;ps.forEach(function(p){if(p.presence.q===S.i)sum+=(+p.presence.fr||0)});
  var avg=ps.length?sum/ps.length:0,boss=S.i>=S.n,good=avg>=(boss?0.6:0.5),fl=S.fl,lt=S.lt;if(good)lt++;else fl--;
  hostEmit({ph:'rv',left:boss?60:12,fl:Math.max(0,fl),lt:lt,good:good?1:0})}
function hostNext(){var S=G.S;
  if(S.mode==='coop'&&S.fl<=0)hostEmit({ph:'end',left:0,win:0});
  else if(S.i<S.n)hostEmit({ph:'q',i:S.i+1,left:G.run.qs[S.i+1]?G.run.qs[S.i+1].dur:G.run.boss.dur});
  else hostEmit({ph:'end',left:0,win:S.mode==='coop'&&S.fl>0?1:0})}
function pickRun(tps,n){var used=P.used,pools={},out=[],g=0;
  tps.forEach(function(t){pools[t]=shuffle(BANK.filter(function(q){return q.tp===t}))});
  var order=shuffle(tps);
  while(out.length<n&&g<400){var t=order[g%order.length];g++;var pl=pools[t];
    var q=pl.find(function(x){return used.indexOf(x.id)<0&&out.indexOf(x.id)<0})||pl.find(function(x){return out.indexOf(x.id)<0});if(q)out.push(q.id)}
  P.used=used.concat(out).slice(-120);var bs=[];SCENES.forEach(function(_,i){if(P.usedBoss.indexOf(i)<0)bs.push(i)});if(!bs.length){P.usedBoss=[];bs=SCENES.map(function(_,i){return i})}
  var boss=bs[Math.floor(Math.random()*bs.length)];P.usedBoss=P.usedBoss.concat([boss]).slice(-3);saveP();return {ids:shuffle(out),boss:boss}}
function startRun(){var S=G.S;if(!S)return;var r=pickRun(S.tp,S.n);hostEmit({ph:'load',seed:Math.floor(Math.random()*1e9)+1,ids:r.ids,boss:r.boss,i:0,fl:3,lt:0,good:0,win:0,left:8})}
function tick(){
  if(!G.room)return;var S=G.S,now=Date.now();
  if(!S){if(iAmHost()&&(G.solo||now-G.joinedAt>3000))hostEmit({ph:'lobby'});return}
  tickUI();
  if(S.ph==='q'&&!G.spec&&!G.answered&&now>=G.dl)autoSubmit();
  if(!iAmHost())return;
  if(S.ph==='load'&&now>=G.dl&&G.run)hostEmit({ph:'q',i:0,left:G.run.qs[0].dur});
  else if(S.ph==='q'){if((allAnswered()&&now>G.qStart+1200)||now>G.dl+2500)hostReveal()}
  else if(S.ph==='rv'&&now>=G.dl)hostNext()}
/* ---------- Belohnungen ---------- */
function tpOk(t){var x=G.my.tpc[t];return x?x[0]:0}
function awardEnd(){var S=G.S;if(G.spec||G.awardedSeed===S.seed||!G.run)return;G.awardedSeed=S.seed;
  var m=G.my,ps=players(),win=false,gain=30+m.okc*10+(m.bossOk?50:0);
  if(S.mode==='coop')win=S.fl>0;else{var top=0;ps.forEach(function(p){top=Math.max(top,+p.presence.sc||0)});win=ps.length>1&&m.sc>=top&&m.sc>0}
  if(win)gain+=20;
  P.xp+=gain;P.runs++;var nb=[],cl=Math.min(5,S.mode==='coop'?S.lt:m.okc);
  var give=function(id){if(giveBadge(id))nb.push(id)};
  give('first');if(P.runs>=5)give('marathon');if(m.okc===S.n&&m.bossOk)give('perfect');if(cl>=5)give('chef');if(cl>=1)give('indice');if(m.best>=5)give('s5');if(m.best>=8)give('s8');
  if(tpOk('pc')+tpOk('im')+tpOk('pq')+tpOk('tp')>=5)give('passe');var inf=m.tpc.inf;if(inf&&inf[1]>=3&&inf[0]===inf[1])give('infin');
  if(tpOk('pd')>=3)give('portrait');if(tpOk('vo')>=4)give('voc');if(S.mode==='coop'&&win)give('team');if(S.mode==='vs'&&win&&ps.length>1)give('duel');
  if(m.tyOk>=5)give('poly');if(m.ty>=3&&m.tyOk===m.ty)give('filet');if(m.bossOk&&m.wc>=40)give('plume');if(S.n>=8)give('tour');if(P.xp>=3000)give('legende');
  saveP();G.gain={xp:gain,nb:nb,win:win,cl:cl}}

  if(e.key==='Enter'&&e.target.id==='nm'){ACT.enter();return}
  if(e.key==='Enter'&&e.target.id==='code'){ACT.join();return}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('input.blank')){e.preventDefault();var v=curView();if(v&&v.ty==='gp'){var ins=Array.prototype.slice.call(document.querySelectorAll('input.blank')),k=ins.indexOf(e.target);if(k<ins.length-1)ins[k+1].focus();else ACT.confirm()}}});
/* ---------- Funkenflug im Hintergrund ---------- */
(function(){var c=$('#motes'),x=c.getContext('2d'),W=0,H=0,m=[],i;
  function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
  for(i=0;i<45;i++)m.push({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.6,s:.06+Math.random()*.25,p:Math.random()*6.28});
  function f(t){x.clearRect(0,0,W,H);m.forEach(function(o){o.y-=o.s;o.x+=Math.sin(t/2200+o.p)*.25;if(o.y<-5){o.y=H+5;o.x=Math.random()*W}
    x.beginPath();x.fillStyle='rgba(255,217,140,'+(.18+.2*Math.sin(t/900+o.p))+')';x.arc(o.x,o.y,o.r,0,6.28);x.fill()});requestAnimationFrame(f)}
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(f)})();

function FbRoom(name){
  var db=firebase.database(),root=db.ref('fil/'+name),pRef=root.child('p'),sRef=root.child('state'),cRef=db.ref('.info/connected'),
  me='p'+Math.random().toString(36).slice(2,9),mine=pRef.child(me),pr={},others={},hs={},ph=[],cn=[],lastS=null,left=false;
  function peers(){var a=[{peer:me,presence:pr,isMe:true,sameTab:true,kind:'viewer',guest:false,by:null,updatedAt:Date.now()}];
    Object.keys(others).forEach(function(k){a.push({peer:k,presence:others[k],isMe:false,sameTab:false,kind:'viewer',guest:false,by:null,updatedAt:Date.now()})});return a}
  function fire(j,l){ph.slice().forEach(function(h){h({peers:peers(),joined:j,left:l,updated:[]})})}
  function msg(v){return {topic:'state',data:v,peer:'db',isMe:false,sameTab:false,kind:'viewer',guest:false,by:null}}
  function onP(snap){var v=snap.val()||{},old=others,j=[],l=[];others={};
    Object.keys(v).forEach(function(k){if(k!==me){others[k]=v[k]||{};if(!old[k])j.push({peer:k,isMe:false})}});
    Object.keys(old).forEach(function(k){if(!others[k])l.push({peer:k,isMe:false})});fire(j,l)}
  function onS(snap){var v=snap.val();if(!v)return;lastS=v;(hs.state||[]).slice().forEach(function(h){h(msg(v))})}
  function onC(snap){var c=!!snap.val();cn.slice().forEach(function(h){h(c)})}
  try{mine.onDisconnect().remove()}catch(e){}
  pRef.on('value',onP);sRef.on('value',onS);cRef.on('value',onC);
  return {
    emit:function(t,d){if(t!=='state'||left)return Promise.resolve();return sRef.set(JSON.parse(JSON.stringify(d)))},
    on:function(t,h){(hs[t]=hs[t]||[]).push(h);if(t==='state'&&lastS)setTimeout(function(){h(msg(lastS))},0);return function(){hs[t]=(hs[t]||[]).filter(function(x){return x!==h})}},
    presence:function(p){if(left)return Promise.resolve();var n=Object.assign({},pr);for(var k in p){if(p[k]===null)delete n[k];else n[k]=p[k]}pr=n;fire([],[]);return mine.update(p)},
    peers:peers,
    onPeers:function(h){ph.push(h);setTimeout(function(){h({peers:peers(),joined:peers(),left:[],updated:[]})},0);return function(){ph=ph.filter(function(x){return x!==h})}},
    connected:function(){return true},
    onConnection:function(h){cn.push(h);return function(){cn=cn.filter(function(x){return x!==h})}},
    leave:function(){left=true;try{pRef.off('value',onP);sRef.off('value',onS);cRef.off('value',onC);mine.onDisconnect().cancel()}catch(e){}return mine.remove()}}}
